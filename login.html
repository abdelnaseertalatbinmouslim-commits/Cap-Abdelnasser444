<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول | Cap Abdelnaseer</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><div class="form-card glass"><a class="brand" href="index.html"><span class="brand-mark">CA</span><span>Cap Abdelnaseer</span></a><h1>مرحبًا بعودتك</h1><p class="muted">الدخول بالحساب القديم: رقم الهاتف + PIN.</p><div id="msg"></div><div class="notice">شرط الدخول: <a href="https://whatsapp.com/channel/0029VbDGX1rJpe8ZM6H5h02T" target="_blank" rel="noopener">انضم لقناة WhatsApp</a> ثم أكد الانضمام بالأسفل.</div><label class="item"><span>انضممت للقناة</span><input id="joined" type="checkbox" required></label><br><form id="loginForm"><div class="group"><label class="label">رقم الهاتف</label><input class="field" id="phone" inputmode="tel" required placeholder="01xxxxxxxxx"></div><div class="group"><label class="label">PIN / كلمة المرور</label><input class="field" id="pin" type="password" required placeholder="••••"></div><button class="btn gold" style="width:100%">دخول آمن</button></form><p class="muted">ليس لديك حساب؟ <a href="register.html" style="color:var(--gold2)">سجل الآن</a></p></div></div></main><script type="module">import{loginStudent}from'./firebase-auth.js';const f=document.querySelector('#loginForm'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();if(!joined.checked){m.innerHTML='<div class="error">يجب تأكيد الانضمام لقناة WhatsApp أولًا.</div>';return}const b=f.querySelector('button');b.disabled=true;b.textContent='جارٍ التحقق...';m.innerHTML='';try{await loginStudent(phone.value,pin.value);location.href='dashboard.html'}catch(x){m.innerHTML=`<div class="error">${x.message}</div>`}finally{b.disabled=false;b.textContent='دخول آمن'}};</script></body></html>
