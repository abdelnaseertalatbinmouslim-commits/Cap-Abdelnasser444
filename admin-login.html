<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Cap Abdelnaseer</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><div class="form-card glass"><div class="brand"><span class="brand-mark">CA</span><span>Cap Abdelnaseer · Admin</span></div><h1>دخول الإدارة</h1><p class="muted">صلاحيات الإدارة منفصلة عن حسابات الطلاب.</p><div id="msg"></div><form id="f"><div class="group"><label class="label">Email</label><input class="field" id="email" type="email" required></div><div class="group"><label class="label">Password</label><input class="field" id="password" type="password" required></div><button class="btn gold" style="width:100%">دخول لوحة الإدارة</button></form></div></div></main><script>const f=document.querySelector('#f'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;b.textContent='جارٍ التحقق...';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message);localStorage.setItem('cap_admin_token',d.token);localStorage.setItem('cap_admin',JSON.stringify(d.admin));location.href='admin.html'}catch(x){m.innerHTML='<div class="error">'+x.message+'</div>'}finally{b.disabled=false;b.textContent='دخول لوحة الإدارة'}};</script></body></html>
