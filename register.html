<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | Cap Abdelnaseer</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><div class="form-card glass"><a class="brand" href="index.html"><span class="brand-mark">CA</span><span>Cap Abdelnaseer</span></a><h1>إنشاء حساب طالب</h1><p class="muted">بعد التسجيل يصبح الحساب في انتظار موافقة الإدارة.</p><div id="msg"></div><form id="reg"><div class="group"><label class="label">الاسم</label><input class="field" id="name" required></div><div class="form-row"><div class="group"><label class="label">رقم الهاتف</label><input class="field" id="phone" inputmode="tel" required></div><div class="group"><label class="label">الصف</label><input class="field" id="grade" required></div></div><div class="form-row"><div class="group"><label class="label">PIN</label><input class="field" id="pin" type="password" inputmode="numeric" required></div><div class="group"><label class="label">تأكيد PIN</label><input class="field" id="confirmPin" type="password" inputmode="numeric" required></div></div><div class="notice">شرط الدخول للمنصة: انضم لقناة WhatsApp أولًا، ثم أكد الانضمام. لن يتم إرسال الـPIN للإدارة عبر Telegram.</div><p><a class="btn" href="https://whatsapp.com/channel/0029VbDGX1rJpe8ZM6H5h02T" target="_blank" rel="noopener">انضم لقناة WhatsApp</a></p><label class="item"><span>انضممت للقناة وأوافق على شرط الدخول</span><input id="joined" type="checkbox" required></label><br><button class="btn gold" style="width:100%">إنشاء الحساب</button></form><p class="muted">لديك حساب؟ <a href="login.html" style="color:var(--gold2)">تسجيل الدخول</a></p></div></div></main><script type="module">import{registerStudent}from'./firebase-auth.js';const f=document.querySelector('#reg'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();if(!joined.checked){m.innerHTML='<div class="error">يجب تأكيد الانضمام لقناة WhatsApp أولًا.</div>';return}const b=f.querySelector('button');b.disabled=true;b.textContent='جارٍ التسجيل...';m.innerHTML='';try{const d=await registerStudent({name:name.value,phone:phone.value,grade:grade.value,pin:pin.value,confirmPin:confirmPin.value});m.innerHTML=`<div class="success">${d.message}</div>`;f.reset()}catch(x){m.innerHTML=`<div class="error">${x.message}</div>`}finally{b.disabled=false;b.textContent='إنشاء الحساب'}};</script></body></html>
